name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tags are covered by release.yml, which runs the same checks before it
# publishes anything — running CI on them as well is duplicate work.

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # The race detector needs a C toolchain on Windows; the Linux job is the
      # one that has to catch data races anyway.
      - name: Unit tests
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

      # The lab directories are Linux containers, so the integration tests only
      # run there.
      - name: Start the lab directories
        if: runner.os == 'Linux'
        run: |
          docker compose -f dev/docker-compose.yml up -d
          for c in padl-lab-openldap padl-lab-lldap; do
            ok=""
            for i in $(seq 1 60); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || true)
              if [ "$status" = "healthy" ]; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "$c never became healthy"
              docker logs "$c"
              exit 1
            fi
          done

      - name: Integration tests
        if: runner.os == 'Linux'
        env:
          PADL_IT: '1'
        run: go test -count=1 ./...

      - name: Lab logs on failure
        if: failure() && runner.os == 'Linux'
        run: |
          docker logs padl-lab-openldap || true
          docker logs padl-lab-lldap || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile
        run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: padl-binaries
          path: dist/

  msi:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build padl.exe
        run: go build -trimpath -ldflags "-s -w" -o padl.exe ./cmd/padl

      - name: Install WiX
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build the MSI
        run: ./packaging/windows/build-msi.ps1 -Version 0.0.0 -Arch x64 -ExePath padl.exe -OutDir dist

      # The installer exists to give people on managed laptops something they
      # can install without an administrator, so assert that it is per-user
      # rather than trusting the WiX Scope attribute to have done its job.
      - name: Check it is a per-user package
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi)[0].FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember(
            'OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember(
            'OpenView', 'InvokeMethod', $null, $db,
            @("SELECT Property, Value FROM Property"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $props = @{}
          while ($true) {
            $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $rec) { break }
            $name = $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 1)
            $val  = $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 2)
            $props[$name] = $val
          }
          $props.GetEnumerator() | Sort-Object Name | ForEach-Object { "  $($_.Name) = $($_.Value)" }
          if ($props['ALLUSERS'] -eq '1') {
            throw "ALLUSERS=1: this is a per-machine package and would demand elevation"
          }

      - name: Install it and run it
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi)[0].FullName
          $p = Start-Process msiexec -PassThru -Wait -NoNewWindow -ArgumentList @(
            '/i', "`"$msi`"", '/quiet', '/norestart', '/l*v', 'install.log')
          if ($p.ExitCode -ne 0) {
            Get-Content install.log -Tail 60
            throw "msiexec failed with $($p.ExitCode)"
          }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\PADL\padl.exe'
          if (-not (Test-Path $exe)) {
            Get-Content install.log -Tail 60
            throw "nothing landed at $exe"
          }
          # Nothing may have been written to a shared location.
          $shared = Join-Path $env:ProgramFiles 'PADL'
          if (Test-Path $shared) { throw "a per-user install wrote to $shared" }
          & $exe -version
          & $exe -paths

      - name: Check the user PATH picked it up
        shell: pwsh
        run: |
          $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          $want = Join-Path $env:LOCALAPPDATA 'Programs\PADL'
          if ($userPath -notlike "*$want*") {
            throw "user PATH does not contain $want; it is: $userPath"
          }
          $machinePath = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          if ($machinePath -like "*PADL*") {
            throw "a per-user install must not touch the machine PATH"
          }

      - name: Uninstall cleanly
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi)[0].FullName
          $p = Start-Process msiexec -PassThru -Wait -NoNewWindow -ArgumentList @(
            '/x', "`"$msi`"", '/quiet', '/norestart', '/l*v', 'uninstall.log')
          if ($p.ExitCode -ne 0) {
            Get-Content uninstall.log -Tail 60
            throw "uninstall failed with $($p.ExitCode)"
          }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\PADL\padl.exe'
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          if ($userPath -like "*Programs\PADL*") {
            throw "uninstall left the PATH entry behind: $userPath"
          }
