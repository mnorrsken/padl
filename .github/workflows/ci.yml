name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tags are covered by release.yml, which runs the same checks before it
# publishes anything — running CI on them as well is duplicate work.

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # The race detector needs a C toolchain on Windows; the Linux job is the
      # one that has to catch data races anyway.
      - name: Unit tests
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

      # The lab directories are Linux containers, so the integration tests only
      # run there.
      - name: Start the lab directories
        if: runner.os == 'Linux'
        run: |
          docker compose -f dev/docker-compose.yml up -d
          for c in padl-lab-openldap padl-lab-lldap; do
            ok=""
            for i in $(seq 1 60); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || true)
              if [ "$status" = "healthy" ]; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "$c never became healthy"
              docker logs "$c"
              exit 1
            fi
          done

      - name: Integration tests
        if: runner.os == 'Linux'
        env:
          PADL_IT: '1'
        run: go test -count=1 ./...

      - name: Lab logs on failure
        if: failure() && runner.os == 'Linux'
        run: |
          docker logs padl-lab-openldap || true
          docker logs padl-lab-lldap || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile
        run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: padl-binaries
          path: dist/
