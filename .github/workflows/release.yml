name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # The race detector needs a C toolchain on Windows; the Linux job is the
      # one that has to catch data races anyway.
      - name: Unit tests
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

      # The lab directories are Linux containers, so the integration tests only
      # run there.
      - name: Start the lab directories
        if: runner.os == 'Linux'
        run: |
          docker compose -f dev/docker-compose.yml up -d
          for c in padl-lab-openldap padl-lab-lldap; do
            ok=""
            for i in $(seq 1 60); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || true)
              if [ "$status" = "healthy" ]; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "$c never became healthy"
              docker logs "$c"
              exit 1
            fi
          done

      - name: Integration tests
        if: runner.os == 'Linux'
        env:
          PADL_IT: '1'
        run: go test -count=1 ./...

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          COMMIT="$(git rev-parse --short HEAD)"
          PKG=github.com/mnorrsken/padl
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target##*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            out="dist/padl_${VERSION_NO_V}_${os}_${arch}${ext}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X ${PKG}/internal/version.Version=${VERSION} -X ${PKG}/internal/version.Commit=${COMMIT}" \
                -o "$out" ./cmd/padl
          done

      - name: Compute sha256 checksums
        working-directory: dist
        run: |
          sha256sum padl_* > checksums.txt
          cat checksums.txt

      - name: Extract the changelog section for this release
        run: |
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          # Everything between this version's heading and the next one.
          awk -v v="$VERSION_NO_V" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > notes-body.md
          if [ ! -s notes-body.md ]; then
            echo "No CHANGELOG section for ${VERSION_NO_V}" >&2
            exit 1
          fi
          cat notes-body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"

          {
            cat notes-body.md
            cat <<NOTES

          ## Install

          \`\`\`sh
          go install github.com/mnorrsken/padl/cmd/padl@${VERSION}
          \`\`\`

          Or download a binary below, then:

          \`\`\`sh
          chmod +x padl_${VERSION_NO_V}_\$(uname -s | tr 'A-Z' 'a-z')_\$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          \`\`\`

          Verify with \`sha256sum -c checksums.txt\` — checksums attached below.
          NOTES
          } > notes.md

          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes-file notes.md \
            dist/padl_* dist/checksums.txt
