name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # The race detector needs a C toolchain on Windows; the Linux job is the
      # one that has to catch data races anyway.
      - name: Unit tests
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

      # The lab directories are Linux containers, so the integration tests only
      # run there.
      - name: Start the lab directories
        if: runner.os == 'Linux'
        run: |
          docker compose -f dev/docker-compose.yml up -d
          for c in padl-lab-openldap padl-lab-lldap; do
            ok=""
            for i in $(seq 1 60); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || true)
              if [ "$status" = "healthy" ]; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "$c never became healthy"
              docker logs "$c"
              exit 1
            fi
          done

      - name: Integration tests
        if: runner.os == 'Linux'
        env:
          PADL_IT: '1'
        run: go test -count=1 ./...

  msi:
    name: Build the Windows installer
    runs-on: windows-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the Windows executables
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/', ''
          $commit  = git rev-parse --short HEAD
          $pkg     = 'github.com/mnorrsken/padl'
          $ldflags = "-s -w -X $pkg/internal/version.Version=$version -X $pkg/internal/version.Commit=$commit"
          foreach ($arch in 'amd64', 'arm64') {
            $env:GOOS = 'windows'; $env:GOARCH = $arch; $env:CGO_ENABLED = '0'
            go build -trimpath -ldflags "$ldflags" -o "padl-$arch.exe" ./cmd/padl
            if ($LASTEXITCODE -ne 0) { throw "build failed for $arch" }
          }

      - name: Install WiX
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build the installers
        shell: pwsh
        run: |
          $version = ($env:GITHUB_REF -replace '^refs/tags/v', '')
          ./packaging/windows/build-msi.ps1 -Version $version -Arch x64   -ExePath padl-amd64.exe -OutDir dist
          ./packaging/windows/build-msi.ps1 -Version $version -Arch arm64 -ExePath padl-arm64.exe -OutDir dist

      # Only the x64 installer can be exercised here; an arm64 MSI will not
      # install on an x64 runner.
      - name: Install, run and uninstall the x64 installer
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*x64.msi)[0].FullName
          $p = Start-Process msiexec -PassThru -Wait -NoNewWindow -ArgumentList @(
            '/i', "`"$msi`"", '/quiet', '/norestart', '/l*v', 'install.log')
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }

          $exe = Join-Path $env:LOCALAPPDATA 'Programs\PADL\padl.exe'
          if (-not (Test-Path $exe)) { Get-Content install.log -Tail 60; throw "nothing landed at $exe" }
          if (Test-Path (Join-Path $env:ProgramFiles 'PADL')) { throw "a per-user install wrote to Program Files" }
          & $exe -version

          $p = Start-Process msiexec -PassThru -Wait -NoNewWindow -ArgumentList @(
            '/x', "`"$msi`"", '/quiet', '/norestart')
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: installers
          path: dist/*.msi
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [test, msi]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          COMMIT="$(git rev-parse --short HEAD)"
          PKG=github.com/mnorrsken/padl
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target##*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            out="dist/padl_${VERSION_NO_V}_${os}_${arch}${ext}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X ${PKG}/internal/version.Version=${VERSION} -X ${PKG}/internal/version.Commit=${COMMIT}" \
                -o "$out" ./cmd/padl
          done

      - name: Fetch the Windows installers
        uses: actions/download-artifact@v7
        with:
          name: installers
          path: dist

      - name: Compute sha256 checksums
        working-directory: dist
        run: |
          sha256sum padl_* > checksums.txt
          cat checksums.txt

      - name: Extract the changelog section for this release
        run: |
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          # Everything between this version's heading and the next one.
          awk -v v="$VERSION_NO_V" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > notes-body.md
          if [ ! -s notes-body.md ]; then
            echo "No CHANGELOG section for ${VERSION_NO_V}" >&2
            exit 1
          fi
          cat notes-body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"

          {
            cat notes-body.md
            cat <<NOTES

          ## Install

          \`\`\`sh
          go install github.com/mnorrsken/padl/cmd/padl@${VERSION}
          \`\`\`

          On Windows, run the \`.msi\`: it installs to \`%LocalAppData%\\Programs\\PADL\`,
          adds itself to your PATH, and needs no administrator rights.

          On linux or macOS, download the matching binary below, then:

          \`\`\`sh
          chmod +x padl_${VERSION_NO_V}_\$(uname -s | tr 'A-Z' 'a-z')_\$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          \`\`\`

          Verify with \`sha256sum -c checksums.txt\` — checksums attached below.
          NOTES
          } > notes.md

          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes-file notes.md \
            dist/padl_* dist/checksums.txt
