# A throwaway OpenLDAP for PADL's integration tests and for poking at the UI by
# hand. It listens on non-standard host ports so it cannot collide with a real
# directory client on the machine.
#
#   docker compose -f dev/docker-compose.yml up -d
#   PADL_IT=1 go test ./...
#
# The server's certificate is self-signed and issued for the container's own
# hostname, so connecting to 127.0.0.1 fails normal verification — which is
# exactly the trust-on-first-use path the tests need to exercise.
services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: padl-lab-openldap
    command: ["--copy-service", "--loglevel", "info"]
    environment:
      LDAP_ORGANISATION: "PADL Lab"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "padl-lab"
      LDAP_CONFIG_PASSWORD: "padl-lab"
      # Without this the server demands a client certificate and every bind
      # fails before it gets anywhere near the trust decision under test.
      LDAP_TLS_VERIFY_CLIENT: "never"
    volumes:
      - ./seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-padl.ldif:ro
    ports:
      - "13389:389"
      - "13636:636"
    healthcheck:
      # Bound, not anonymous: the lab keeps OpenLDAP's default ACLs, which hide
      # the data from an unauthenticated client.
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost",
             "-D", "cn=admin,dc=example,dc=com", "-w", "padl-lab",
             "-b", "dc=example,dc=com", "-s", "base", "dn"]
      interval: 3s
      timeout: 5s
      retries: 20

  # lldap is a small, opinionated directory that a lot of homelabs run. It is
  # here because it rejects anything but its own bind DN shape
  # (uid=<id>,ou=people,<base>) with a naming violation, which is exactly the
  # kind of failure PADL has to report legibly rather than swallow.
  lldap:
    image: lldap/lldap:stable
    container_name: padl-lab-lldap
    environment:
      LLDAP_JWT_SECRET: "padl-lab-jwt-secret-not-for-real-use"
      LLDAP_KEY_SEED: "padl-lab-key-seed"
      LLDAP_LDAP_BASE_DN: "dc=example,dc=com"
      LLDAP_LDAP_USER_PASS: "padl-lab"
    ports:
      - "13390:3890"
      - "17170:17170"
    healthcheck:
      test: ["CMD", "/app/lldap", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 20

  # An Active Directory domain to test against, seeded by dev/samba-seed.sh.
  #
  # AD is the server PADL carries the most special handling for — objectGUID and
  # objectSid rendering, FILETIME timestamps, userAccountControl flags, a
  # quick-search list led by sAMAccountName, RFC 2696 paging — and none of it was
  # covered by anything runnable. Samba is how you get a domain controller into a
  # container; the subject under test is AD, not Samba.
  #
  # Two things differ from the other two containers and are the point rather than
  # an accident:
  #
  #   - It refuses a simple bind on an unencrypted connection, the way a domain
  #     controller with LDAP signing required does, so the tests reach it over
  #     LDAPS or StartTLS. The plain-LDAP refusal is itself worth pinning.
  #   - It serves a certificate the lab issues it (dev/samba-cert.py), because a
  #     domain controller has one installed rather than improvised at startup.
  #     It is self-signed and issued for the container's hostname, so connecting
  #     to 127.0.0.1 still goes through the same trust-on-first-use path the
  #     OpenLDAP lab exercises.
  #
  # SYS_ADMIN is not optional. Provisioning writes the sysvol NT ACLs through
  # smbd, and without the capability it dies partway with NT_STATUS_ACCESS_DENIED
  # and no usable domain.
  #
  # Provisioning takes the best part of a minute, which is why start_period is
  # what it is. The other two are up in seconds.
  samba-ad:
    image: instantlinux/samba-dc:4.23.10-r0
    container_name: padl-lab-ad
    hostname: padldc
    cap_add:
      - SYS_ADMIN
    environment:
      REALM: "ad.example.com"
      WORKGROUP: "AD"
      NETBIOS_NAME: "PADLDC"
      DOMAIN_ACTION: "provision"
    # The image execs samba in the foreground, so seeding needs a wrapper around
    # its entrypoint rather than a command of its own.
    entrypoint: ["/bin/sh", "/seed/samba-entrypoint.sh"]
    secrets:
      - samba-admin-password
    volumes:
      - ./samba-entrypoint.sh:/seed/samba-entrypoint.sh:ro
      - ./samba-seed.sh:/seed/samba-seed.sh:ro
      - ./samba-cert.py:/seed/samba-cert.py:ro
    ports:
      # 13391 and 13637 are left free for the eDirectory container people start
      # by hand; see docs/manual-tests.md.
      - "13392:389"
      - "13638:636"
    healthcheck:
      # Both halves matter: the first says samba is answering on LDAP, the
      # second that the seed finished. A directory that is up but empty would
      # fail the tests in a way that looks like a PADL bug.
      test: ["CMD-SHELL",
             "ldbsearch -H ldap://localhost --scope=base -b '' defaultNamingContext >/dev/null 2>&1 && test -f /var/lib/samba/.padl-seeded"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 90s

# The image reads the domain administrator's password from a secret rather than
# an environment variable. AD enforces complexity on it, so it cannot be the
# "padl-lab" the rest of the lab uses — everything the seed creates afterwards
# can be, because the seed turns complexity off first.
secrets:
  samba-admin-password:
    file: ./samba-admin-password
